name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Bind to the same environment as the deploy job so we can read
    # github-pages environment-scoped secrets.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Direct backend URLs baked into the bundle. Stored as
          # environment Variables (not Secrets) since they're public IPs.
          # Both backends must send Access-Control-Allow-Origin: *
          # (or this Pages origin).
          VITE_PREAUDIT_PROXY:  ${{ vars.VITE_PREAUDIT_PROXY }}
          VITE_POSTAUDIT_PROXY: ${{ vars.VITE_POSTAUDIT_PROXY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
